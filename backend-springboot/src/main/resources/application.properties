spring.application.name=agri-backend
server.port=8080

# ── Database (file-persisted H2) ─────────────────────────────
spring.datasource.url=jdbc:h2:file:./backend_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

# H2 console — enabled in dev only (disable in prod by setting env var)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Secrets (loaded from secrets.properties locally) ─────────
spring.config.import=optional:file:./secrets.properties
app.api.base-path=/api
app.weather.api-key=${WEATHER_API_KEY:demo_key}
app.weather.base-url=http://api.openweathermap.org/data/2.5
app.ai.gemini-api-key=${GEMINI_API_KEY:demo_key}
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.api-key=${APP_API_KEY:agri_hub_desktop_client_secret_2026}

# ── CORS (desktop client on localhost) ───────────────────────
app.cors.allowed-origins=http://localhost,http://localhost:8080

# ── Resilience4j Rate Limiting ───────────────────────────────
resilience4j.ratelimiter.instances.ai-endpoint.limit-for-period=10
resilience4j.ratelimiter.instances.ai-endpoint.limit-refresh-period=1m
resilience4j.ratelimiter.instances.ai-endpoint.timeout-duration=0

# ── Logging ──────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.rubaet.agri=INFO
